<style>
/* 신드롬.com 결: 흰 종이 + 그레인, 마이크로 타이포 헤더, 큰 글자 인덱스, 리본 하나 */
:root {
  --paper: #ffffff;
  --ink: #0f0f10;
  --mid: #9b9b9f;
  --hair: #ececee;
  --blue: #2d46ff;
  --sans: "Geist", "Helvetica Neue", Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, monospace;
  --serif: "Instrument Serif", "Times New Roman", serif;
  --ko: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100dvh; background: var(--paper); color: var(--ink); font-family: var(--sans), var(--ko); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 1px solid var(--blue); outline-offset: 3px; }

.grain { position: fixed; inset: -50%; pointer-events: none; z-index: 50; opacity: .045; background-size: 160px; animation: grain 1s steps(6) infinite; }
@keyframes grain { 0% { transform: translate(0,0); } 33% { transform: translate(-3%, 2%); } 66% { transform: translate(2%, -3%); } }
.ribbon { position: fixed; right: -6vw; top: 18vh; width: min(520px, 46vw); mix-blend-mode: multiply; opacity: .75; pointer-events: none; z-index: 0; transform: rotate(-24deg); }
.ribbon img { display: block; width: 100%; }

/* 머리 */
.head { position: relative; z-index: 2; display: grid; grid-template-columns: 1fr auto; gap: 20px; padding: calc(18px + env(safe-area-inset-top, 0px)) 24px 0; font: 400 11px/1.35 var(--sans); }
.head span { color: var(--mid); }
.h3 { text-align: right; }
.h3::after { content: ""; display: block; width: 60px; height: 1px; margin: 10px 0 0 auto; background: var(--hair); }

/* 큰 글자 */
.hero { position: relative; z-index: 2; padding: 13vh 24px 9vh; }
.title { margin: 0; font: 400 clamp(64px, 11vw, 150px)/.9 var(--sans); letter-spacing: -.055em; display: flex; align-items: flex-start; gap: 10px; }
.title em { font: italic 400 1.04em/.9 var(--serif); letter-spacing: -.02em; }
.title sup, .line sup { font: 400 11px/1 var(--mono); letter-spacing: 0; margin-top: .9em; color: var(--mid); }
.line { margin-top: 6px; font: italic 400 clamp(30px, 4.6vw, 60px)/1 var(--serif); display: flex; align-items: flex-start; gap: 8px; }
.line sup { margin-top: .5em; }
.note { margin-top: 28px; max-width: 260px; font: 300 12px/1.65 var(--ko); }
.note b { display: block; font: 400 11px var(--mono); color: var(--mid); margin-bottom: 6px; letter-spacing: .04em; }

/* 계정 목록 */
.list { position: relative; z-index: 2; list-style: none; margin: 0; padding: 0 24px 72px; max-width: 760px; }
.list li { border-top: 1px solid var(--hair); }
.list li:last-child { border-bottom: 1px solid var(--hair); }
.row { display: grid; grid-template-columns: 30px 48px 1fr auto 18px; align-items: center; gap: 14px; padding: 18px 0; transition: padding .35s cubic-bezier(.2,.8,.2,1); -webkit-tap-highlight-color: transparent; }
.row:hover { padding-left: 10px; }
.rn { font: 400 10px var(--mono); color: var(--mid); align-self: start; padding-top: 6px; }
.av { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; border: 1px solid var(--hair); background: var(--hair); }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.meta { min-width: 0; }
.meta b { display: block; font: 400 clamp(20px, 2.6vw, 28px)/1.05 var(--sans); letter-spacing: -.04em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta small { display: block; margin-top: 5px; font: 400 10px var(--mono); color: var(--mid); letter-spacing: .06em; }
.thumbs { display: grid; grid-template-columns: repeat(3, 34px); gap: 2px; }
.thumbs img { width: 34px; height: 34px; object-fit: cover; display: block; background: var(--hair); filter: saturate(.85) contrast(1.05); }
.bw, .bw img { filter: grayscale(1) !important; }
.ga { font: 400 14px var(--mono); color: var(--mid); transition: color .3s, transform .3s; }
.row:hover .ga { color: var(--blue); transform: translateX(4px); }
@media (max-width: 420px) { .thumbs { display: none; } .row { grid-template-columns: 24px 44px 1fr 18px; } .av { width: 44px; height: 44px; } }

/* 컴퓨터: 폰 세 대 */
.phones { display: none; }
@media (min-width: 1180px) {
  .hero { padding: 9vh 24px 6vh; }
  .list { display: none; }
  .phones { position: relative; z-index: 2; display: flex; justify-content: center; gap: 44px; padding: 0 24px 80px; }
  .phone { display: flex; flex-direction: column; gap: 14px; }
  .frame { width: 330px; height: 690px; border: 1px solid var(--ink); border-radius: 44px; padding: 10px; background: var(--paper); overflow: hidden; }
  .screen { width: 100%; height: 100%; border-radius: 34px; overflow: hidden; position: relative; background: #fff; }
  /* 390px 폰 화면을 그대로 그린 뒤 줄여서 넣어요 → 글씨도 같이 작아짐 */
  .screen iframe { position: absolute; left: 0; top: 0; width: 390px; height: calc(100% / .7949); border: 0; transform: scale(.7949); transform-origin: 0 0; }
  .cap { display: flex; justify-content: space-between; font: 400 10px var(--mono); color: var(--mid); letter-spacing: .06em; padding: 0 6px; }
  .cap a:hover { color: var(--blue); }
}
@media (prefers-reduced-motion: reduce) { .grain { animation: none; } }

<script>
(function () {
  // 넓은 화면에서만 폰 화면(iframe)을 불러와서 모바일은 가볍게 유지
  var mq = window.matchMedia('(min-width: 1180px)');
  function load() {
    if (!mq.matches) return;
    document.querySelectorAll('iframe[data-src]').forEach(function (f) { f.src = f.getAttribute('data-src'); f.removeAttribute('data-src'); });
  }
  load();
  if (mq.addEventListener) mq.addEventListener('change', load);

  // 시계
  function clk() { var d = new Date(), p = function (v) { return String(v).padStart(2, '0'); }; document.getElementById('clock').textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()); }
  clk(); setInterval(clk, 1000);

  // 그레인
  var g = document.createElement('canvas'), gx = g.getContext('2d'); g.width = g.height = 160; var id = gx.createImageData(160, 160);
  for (var i = 0; i < id.data.length; i += 4) { var v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  gx.putImageData(id, 0, 0); document.getElementById('grain').style.backgroundImage = 'url(' + g.toDataURL() + ')';
})();
</script>
